name: Add an approved song to its pack
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency: packs
jobs:
  add:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'song')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add the song
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/add-song.mjs
      - name: Publish
        run: |
          git config user.name "charis-songs-bot"
          git config user.email "songs-bot@users.noreply.github.com"
          git add packs
          git diff --cached --quiet || git commit -m "Add shared song (#${{ github.event.issue.number }})"
          git push
      - name: Close the issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: 'Added to the song pack. Thank you for sharing! It appears in Charis Studio under Library → Import → Song packs.' })
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' })
